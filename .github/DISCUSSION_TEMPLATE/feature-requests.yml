title: "[Feature Request] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        #### ⚠️ Don't forget to search [existing issues](https://github.com/gethomepage/homepage/search?q=&type=issues) and [discussions](https://github.com/gethomepage/homepage/search?q=&type=discussions) (including closed ones!).
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what you would like to see.
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: Other
      description: Add any other context or information about the feature request here.
  - type: dropdown
    id: ai-disclosure
    attributes:
      label: AI disclosure
      description: Our [contributing guidelines](https://github.com/gethomepage/homepage/blob/main/CONTRIBUTING.md#use-of-ai-tools) require that any content generated in whole or in part by an AI tool or agent be clearly disclosed. Please indicate whether that applies to this request.
      options:
        - "No AI tools were used to generate this request"
        - "AI tools were used to generate part or all of this request"
    validations:
      required: true
